name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualite:
    name: Regles de qualite des donnees
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Seules pandas et pytest sont installees : les regles de qualite
      # ne dependent ni de PostgreSQL ni d Airflow.
      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.2 pytest==8.2.2

      - name: Executer les tests
        run: python -m pytest tests -v

      - name: Verifier la syntaxe des modules ETL
        run: python -m compileall -q src