name: Tests

# Declencheurs : a chaque push et a chaque pull request sur main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualite:
    name: Regles de qualite des donnees
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.2 pytest==8.2.2

      - name: Executer les tests
        run: python -m pytest -v

      - name: Verifier la syntaxe des modules ETL
        run: python -m compileall -q src dags